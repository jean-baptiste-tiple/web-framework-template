name: CI

on:
  push:
  pull_request:

jobs:
  # Nom des branches de chantier (deploy.md § Circuit) : le sujet seul, sans
  # préfixe client ni ID de tâche, 25 caractères au plus, sinon Vercel abrège
  # l'adresse d'aperçu et elle n'est plus prévisible.
  nom-de-branche:
    # Branches créées par l'interface de Claude Code en ligne (claude/…) : hors règle.
    if: github.event_name == 'push' && github.ref_name != 'main' && !startsWith(github.ref_name, 'claude/')
    runs-on: ubuntu-latest
    steps:
      - name: Contrôler le nom
        env:
          NOM: ${{ github.ref_name }}
        run: |
          if [ ${#NOM} -gt 25 ] || ! printf '%s' "$NOM" | grep -Eq '^[a-z0-9]+(-[a-z0-9]+)*$' \
             || printf '%s' "$NOM" | grep -Eq '^[a-z]+-?[0-9]+-'; then
            echo "::error::Branche « $NOM » : le sujet seul, sans préfixe client ni ID de tâche, minuscules, chiffres et tirets, 25 caractères au plus (deploy.md § Circuit)."
            exit 1
          fi
  build:
    if: github.event_name != 'push' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # La version de pnpm vient de "packageManager" dans package.json.
      # Ne PAS remettre `with: version`, sinon conflit ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Images déjà optimisées gardées d'une exécution à l'autre (cache d'images
      # d'Astro, node_modules/.astro/assets) : sans lui, toutes les variantes sont
      # régénérées à chaque fois. Pas tout node_modules/.astro :
      # data-store.json y garderait des pages supprimées.
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro/assets
          key: astro-${{ runner.os }}-${{ hashFiles('src/**/*.png', 'src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.webp', 'src/**/*.avif', 'astro.config.mjs', 'pnpm-lock.yaml') }}
          restore-keys: astro-${{ runner.os }}-
      # astro check (types + frontmatter Zod) puis build statique : attrape
      # frontmatter invalide, lien de collection cassé, erreur de génération.
      - run: pnpm build
